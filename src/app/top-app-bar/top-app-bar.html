<mat-toolbar class="top-app-bar">
  <!-- Easter Egg: Ein Klick aufs Sparschwein wirft eine Münze ein -->
  <span class="logo" aria-hidden="true" (click)="dropCoin()">
    @for (coin of coins(); track coin) {
      <span class="coin" (animationend)="coinLanded(coin)"></span>
    }
    <mat-icon #piggyBank>savings</mat-icon>
  </span>
  <span class="title">CampPlan</span>
  <span class="spacer"></span>
  <mat-slide-toggle class="per-participant" [checked]="perParticipant()" (change)="perParticipant.set($event.checked)">
    {{ t().common.perParticipant }}
  </mat-slide-toggle>
  <input #fileInput type="file" accept=".json,application/json" hidden (change)="open(fileInput)"/>
  <!-- Auf schmalen Bildschirmen stehen diese Aktionen im Überlaufmenü (M3: höchstens drei Aktionen in der Leiste) -->
  <button mat-icon-button class="wide-only" (click)="fileInput.click()" [attr.aria-label]="t().topBar.open"
          [matTooltip]="t().topBar.openShortcut">
    <mat-icon>folder_open</mat-icon>
  </button>
  <button mat-icon-button class="wide-only" (click)="save()" [attr.aria-label]="t().topBar.save"
          [matTooltip]="t().topBar.saveShortcut">
    <mat-icon>save</mat-icon>
  </button>
  <button mat-icon-button class="wide-only" (click)="exportPdf()" [disabled]="exporting()"
          [attr.aria-label]="t().topBar.exportPdf" [matTooltip]="t().topBar.exportPdf">
    <mat-icon>picture_as_pdf</mat-icon>
  </button>
  <button mat-icon-button [matMenuTriggerFor]="moreMenu" [attr.aria-label]="t().topBar.moreActions"
          [matTooltip]="t().topBar.moreActions">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #moreMenu="matMenu" xPosition="before">
    <div class="compact-only">
      <button mat-menu-item (click)="fileInput.click()">
        <mat-icon>folder_open</mat-icon>
        <span>{{ t().topBar.open }}</span>
      </button>
      <button mat-menu-item (click)="save()">
        <mat-icon>save</mat-icon>
        <span>{{ t().topBar.save }}</span>
      </button>
      <button mat-menu-item (click)="exportPdf()" [disabled]="exporting()">
        <mat-icon>picture_as_pdf</mat-icon>
        <span>{{ t().topBar.exportPdf }}</span>
      </button>
      <mat-divider></mat-divider>
    </div>
    <button mat-menu-item role="menuitemcheckbox" [attr.aria-checked]="dark()"
            (click)="$event.stopPropagation(); theme.setDark(!dark())">
      <mat-icon>dark_mode</mat-icon>
      <span class="menu-toggle">
        {{ t().topBar.darkMode }}
        <mat-slide-toggle [checked]="dark()" tabindex="-1" aria-hidden="true"></mat-slide-toggle>
      </span>
    </button>
    <button mat-menu-item [matMenuTriggerFor]="languageMenu">
      <mat-icon>language</mat-icon>
      <span>{{ t().topBar.language }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="reset()">
      <mat-icon>restart_alt</mat-icon>
      <span>{{ t().topBar.loadExample }}</span>
    </button>
    <button mat-menu-item (click)="resetAll()">
      <mat-icon>delete_forever</mat-icon>
      <span>{{ t().topBar.resetAll }}</span>
    </button>
  </mat-menu>
  <!-- Jede Sprache unter ihrem eigenen Namen, damit man sie auch findet, wenn man die aktuelle nicht versteht -->
  <mat-menu #languageMenu="matMenu">
    @for (option of languages; track option.language) {
      <button mat-menu-item role="menuitemradio" [attr.aria-checked]="option.language === language()"
              [attr.lang]="option.language" (click)="languageStore.setLanguage(option.language)">
        <mat-icon [class.unselected]="option.language !== language()">check</mat-icon>
        <span>{{ option.name }}</span>
      </button>
    }
  </mat-menu>
  <!-- Nur bei Rechnungen, die spürbar dauern; liegt auf der Unterkante der Leiste, damit nichts verrutscht -->
  @let share = progress();
  @if (share !== null) {
    <mat-progress-bar class="calculation-progress" mode="determinate" [value]="share * 100"
                      [attr.aria-label]="t().topBar.calculating" />
  }
</mat-toolbar>
