<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ graph.title }}</mat-card-title>
    <mat-card-subtitle>{{ graph.subtitle }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="dimensions">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>X-Achse</mat-label>
        <mat-select [value]="xDimension" [compareWith]="compareDimension" (selectionChange)="setDimension('x', $event.value)">
          @for (option of dimensionOptions; track $index) {
            <mat-option [value]="option.dimension" [disabled]="!option.varies">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Y-Achse</mat-label>
        <mat-select [value]="yDimension ?? 'none'" [compareWith]="compareDimension"
                    (selectionChange)="setDimension('y', $event.value === 'none' ? null : $event.value)">
          <mat-option value="none">keine</mat-option>
          @for (option of dimensionOptions; track $index) {
            @if (!sameDimension(option.dimension, xDimension)) {
              <mat-option [value]="option.dimension" [disabled]="!option.varies">{{ option.label }}</mat-option>
            }
          }
        </mat-select>
      </mat-form-field>
    </div>
    <plotly-plot class="plot" [data]="graph.data" [layout]="graph.layout" [revision]="revision"
                 [useResizeHandler]="true" [style]="{width: '100%', height: '100%'}"></plotly-plot>
  </mat-card-content>
</mat-card>
