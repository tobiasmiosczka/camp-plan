<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Verteilung der Szenarien</mat-card-title>
    <mat-card-subtitle>{{ graph.subtitle }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-button-toggle-group [value]="metric" (change)="setMetric($event.value)" aria-label="Dargestellte Größe">
      <mat-button-toggle value="balance">Überschuss</mat-button-toggle>
      <mat-button-toggle value="debit">Ausgaben</mat-button-toggle>
      <mat-button-toggle value="credit">Einnahmen</mat-button-toggle>
    </mat-button-toggle-group>
    <plotly-plot class="plot" [data]="graph.data" [layout]="graph.layout" [revision]="revision"
                 [useResizeHandler]="true" [style]="{width: '100%', height: '100%'}"></plotly-plot>
  </mat-card-content>
</mat-card>
