<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ t().charts.distribution }}</mat-card-title>
    <mat-card-subtitle>{{ graph().subtitle }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-button-toggle-group [value]="metric()" (change)="metric.set($event.value)" [attr.aria-label]="t().charts.metric">
      <mat-button-toggle value="balance">{{ t().common.surplus }}</mat-button-toggle>
      <mat-button-toggle value="debit">{{ t().common.debit }}</mat-button-toggle>
      <mat-button-toggle value="credit">{{ t().common.credit }}</mat-button-toggle>
    </mat-button-toggle-group>
    <plotly-plot class="plot" [data]="graph().data" [layout]="graph().layout"
                 [useResizeHandler]="true" [style]="{width: '100%', height: '100%'}"></plotly-plot>
  </mat-card-content>
</mat-card>
