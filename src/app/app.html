<mat-toolbar class="top-app-bar">
  <mat-icon aria-hidden="true">savings</mat-icon>
  <span class="title">CampPlan</span>
  <span class="spacer"></span>
  <input #fileInput type="file" accept=".json,application/json" hidden (change)="open(fileInput)"/>
  <button mat-icon-button (click)="fileInput.click()" aria-label="Plan öffnen" matTooltip="Plan öffnen (Strg+O)">
    <mat-icon>folder_open</mat-icon>
  </button>
  <button mat-icon-button (click)="save()" aria-label="Plan speichern" matTooltip="Plan speichern (Strg+S)">
    <mat-icon>save</mat-icon>
  </button>
  <button mat-icon-button [matMenuTriggerFor]="moreMenu" aria-label="Weitere Aktionen" matTooltip="Weitere Aktionen">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #moreMenu="matMenu" xPosition="before">
    <button mat-menu-item (click)="reset()">
      <mat-icon>restart_alt</mat-icon>
      <span>Beispielplan laden</span>
    </button>
  </mat-menu>
</mat-toolbar>
<main>
  <router-outlet />
</main>
